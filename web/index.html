<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f5" />
    <title>LocalManus</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell empty" id="app-shell">
      <header class="app-header">
        <a class="wordmark" href="/">LocalManus</a>
      </header>

      <main class="main-content" id="main-content">
        <section class="empty-intro" id="empty-intro">
          <h1>Hello, there!</h1>
          <p>LocalManus, built on cutting-edge language models, helps you search on the web, browse information, and handle complex tasks.</p>
          <div class="suggestion" aria-label="Suggested prompt">
            <span class="suggestion-label">Try a research prompt</span>
            <button class="suggestion-button" id="influence-suggestion" type="button">Calculate the influence index of the latest DeepSeek model on Hugging Face, currently deepseek-ai/DeepSeek-V4-Pro-0813, using downloads and likes from the official model API. Include followers only if an official public count is available; otherwise use a clearly labeled proxy or explain why it is unavailable. Explain the weights and show the calculation.</button>
          </div>
        </section>
        <section class="message-history" id="message-history" aria-live="polite"></section>
      </main>

      <footer class="composer-wrap" id="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="prompt" rows="1" placeholder="What can I do for you?" aria-label="Message"></textarea>
          <div class="composer-toolbar">
            <div class="composer-options">
              <button class="option-button" id="deep-think" type="button" aria-pressed="false"><span class="option-icon">*</span> Deep Think</button>
              <button class="option-button" id="search-first" type="button" aria-pressed="false"><span class="option-icon">@</span> Search</button>
            </div>
            <button class="send-button" id="send-button" type="submit" title="Send message" aria-label="Send message"><span id="send-icon">&gt;</span></button>
          </div>
        </form>
        <div class="composer-underlay"></div>
      </footer>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
