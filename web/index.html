<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f5" />
    <title>LocalManus</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell empty" id="app-shell">
      <header class="app-header">
        <a class="wordmark" href="/">LocalManus</a>
      </header>

      <main class="main-content" id="main-content">
        <section class="empty-intro" id="empty-intro">
          <h1>Hello, there!</h1>
          <p>LocalManus, built on cutting-edge language models, helps you search on the web, browse information, and handle complex tasks.</p>
          <div class="suggestion" aria-label="Suggested prompt">
            <span class="suggestion-label">Try a research prompt</span>
            <button class="suggestion-button" id="influence-suggestion" type="button">Calculate the influence index of DeepSeek R1 on Hugging Face using a weighted sum of followers, downloads, and likes. Explain the weights, gather current metrics, and show the calculation.</button>
          </div>
        </section>
        <section class="message-history" id="message-history" aria-live="polite"></section>
      </main>

      <footer class="composer-wrap" id="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="prompt" rows="1" placeholder="What can I do for you?" aria-label="Message"></textarea>
          <div class="composer-toolbar">
            <div class="composer-options">
              <button class="option-button" id="deep-think" type="button" aria-pressed="false"><svg class="option-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l1.6 3.9 3.9 1.6-3.9 1.6L8 12.5 6.4 8.6 2.5 7l3.9-1.6z"/></svg>Deep Think</button>
              <button class="option-button" id="search-first" type="button" aria-pressed="false"><svg class="option-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Search</button>
              <span class="model-badge" id="model-badge" title="Active model">
                <span class="model-dot" aria-hidden="true"></span><span id="model-name">…</span>
              </span>
            </div>
            <button class="send-button" id="send-button" type="submit" title="Send message" aria-label="Send message"><svg id="send-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M8 3.5L4 7.5M8 3.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </form>
        <div class="composer-underlay"></div>
      </footer>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
